name: Build ImmortalWRT for AX1800 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true
      CCACHE_DIR: /home/runner/.ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set compile date
        run: |
          echo "BUILD_DATE=$(TZ='Asia/Shanghai' date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev \
          libncursesw5-dev libssl-dev python3 python3-dev python3-pyelftools \
          rsync subversion swig time xsltproc zlib1g-dev unzip libzstd-dev \
          liblzma-dev liblz4-dev aria2 jq

      - name: Clone ImmortalWRT source
        run: |
          git config --global safe.directory '*'
          git clone --depth=1 --branch openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Cache OpenWrt dl
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('openwrt/include/kernel-*') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-openwrt-ccache-${{ hashFiles('openwrt/.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-ccache-

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply and enforce custom config
        env:
          TERM: xterm-256color
        run: |
          if [ -f .config ]; then
            cp .config openwrt/.config
          elif [ -f config.txt ]; then
            cp config.txt openwrt/.config
          elif [ -f "config (1).txt" ]; then
            cp "config (1).txt" openwrt/.config
          else
            touch openwrt/.config
          fi

          cd openwrt
          # 彻底清除可能导致冲突的旧 target 标记
          sed -i '/CONFIG_TARGET_qualcommax/d' .config
          
          # 强制锁定京东云亚瑟 RE-SS-01 (AX1800 Pro) 目标设备与编译加速选项
          cat <<EOF >> .config
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          EOF

          # 使用纯命令行模式自动补全与修复配置，绝对不触发图形化 menuconfig
          make defconfig

      - name: Verify selected target device
        run: |
          cd openwrt
          echo "=== 校验目标设备配置 ==="
          grep "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y" .config || (echo "错误：Target 配置未正确生效！" && exit 1)

      - name: Download package source codes
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile the firmware
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s

      - name: Organize firmware files
        run: |
          mkdir -p firmware_output

          # 提取 sysupgrade.bin，并同步生成 FACTORY.bin 格式供 chenxin527 U-Boot Web 界面刷入
          find openwrt/bin/targets/ -type f -name "*sysupgrade.bin" | while read file; do
            cp -f "$file" "firmware_output/JDCLOUD_RE-SS-01-SQUASHFS-FACTORY-${BUILD_DATE}.bin"
            cp -f "$file" "firmware_output/JDCLOUD_RE-SS-01-SQUASHFS-SYSUPGRADE-${BUILD_DATE}.bin"
          done

          # 校验生成的固件体积，若低于 15MB 则判定编译异常
          for bin in firmware_output/*.bin; do
            if [ -f "$bin" ]; then
              size=$(stat -c%s "$bin")
              if [ $size -lt 15728640 ]; then
                echo "错误：固件 $bin 体积异常 ($size bytes)！"
                exit 1
              fi
            else
              echo "错误：未找到生成的 .bin 固件！"
              exit 1
            fi
          done

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWRT-AX1800-Pro-${{ env.BUILD_DATE }}
          path: firmware_output/*.bin
