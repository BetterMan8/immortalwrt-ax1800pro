name: Build ImmortalWRT for AX1800 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev \
          libncursesw5-dev libssl-dev python3 python3-dev python3-pyelftools \
          rsync subversion swig time xsltproc zlib1g-dev unzip libzstd-dev \
          liblzma-dev liblz4-dev aria2 jq

      - name: Clone ImmortalWRT source
        run: |
          git clone --depth=1 --branch=openwrt-24.10 \
            https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply custom config
        run: |
          # 自动将你仓库根目录的 .config 复制到源码目录
          cp .config openwrt/.config
          cd openwrt
          make defconfig

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) download
          make -j$(nproc)

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWRT-AX1800-Pro-Firmware
          path: openwrt/bin/targets/*/*/
